<PRE>

"Electric Parent"

Plastic smiles dance around the screen,
Babbling with their perfect teeth.
Lying through the laughter; enticing,
Numbing and mesmerizing.
Contrived situations and false worlds
Filled with impossible ideals
and bodies and faces
sculpted by the most expert
knife.
